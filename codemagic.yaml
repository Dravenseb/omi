# Workflow Codemagic — build iOS du Pendant Limitless vers TestFlight.
#
# À copier en `codemagic.yaml` à la racine de la branche `self-host` du fork Omi.
# Voir docs/IOS_BUILD.md pour la marche à suivre complète.
#
# Variables à créer dans Codemagic (groupe `pendant`, TOUTES chiffrées) :
#   OMI_API_BASE_URL   ex. https://<ton-domaine>.ngrok-free.app/   (slash final obligatoire)
#   GOOGLE_INFO_PLIST  le GoogleService-Info.plist encodé en base64
#   BUNDLE_ID          ex. com.tonnom.pendant  (les cibles annexes en derivent : .widget, .watchapp)
#   CERTIFICATE_PRIVATE_KEY  cle privee RSA au format PEM, generee une fois et
#                            conservee telle quelle : elle identifie le
#                            certificat de distribution Apple
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID de la cle API App Store Connect
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID de cette meme cle (ex. F3DXCK9947)
#   PENDANT_ASC_KEY_B64               le fichier .p8 encode en base64, sur UNE
#                                     ligne. Nom volontairement distinct des
#                                     variables APP_STORE_CONNECT_* que
#                                     l'integration peuple, pour eviter tout
#                                     masquage. (APP_STORE_CONNECT_PRIVATE_KEY
#                                     reste accepte en repli.)
#
# Ces trois dernieres sont lues directement par l'outil app-store-connect.
# L'integration nommee ci-dessous sert a la publication, mais n'expose pas ses
# identifiants aux scripts : sans elles, l'API Apple repond 401.

workflows:
  pendant-testflight:
    name: Pendant Limitless -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      # Nom donné à la clé API App Store Connect dans Codemagic (Teams > Integrations).
      app_store_connect: pendant_limitless
    environment:
      # Pas de bloc ios_signing : la signature automatique ne traite qu'un seul
      # bundle ID et ne cree pas les profils manquants. Elle est faite
      # explicitement dans l'etape « Signature iOS ».
      groups:
        - pendant
      flutter: 3.44.5
      xcode: 26.0.1
      cocoapods: 1.16.2
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    working_directory: app
    scripts:
      - name: Dépendances natives (codec audio du Pendant)
        script: brew install opus opus-tools

      - name: Configuration Firebase + .env
        script: |
          set -e
          echo "$GOOGLE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          # Une phase de script du projet Xcode recopie Config/<flavor>/ par-dessus
          # Runner/ selon la configuration ; en Release-prod, sans ce dossier le
          # `cp` echoue et fait tomber le build.
          mkdir -p ios/Config/Prod ios/Config/Dev
          cp ios/Runner/GoogleService-Info.plist ios/Config/Prod/
          cp ios/Runner/GoogleService-Info.plist ios/Config/Dev/
          # Custom.xcconfig porte GOOGLE_REVERSE_CLIENT_ID, requis par la connexion Google.
          sh scripts/generate_ios_custom_config.sh ios/Runner/GoogleService-Info.plist ios/Flutter/
          # main.dart importe firebase_options_prod.dart, absent du depot.
          sh scripts/gen_firebase_options_prod.sh ios/Runner/GoogleService-Info.plist lib/firebase_options_prod.dart
          # envied lit app/.env au build_runner ; sans ce fichier la génération échoue.
          echo "API_BASE_URL=$OMI_API_BASE_URL" > .env
          echo "GOOGLE_MAPS_API_KEY=" >> .env
          echo "GOOGLE_CLIENT_ID=" >> .env
          echo "GOOGLE_CLIENT_SECRET=" >> .env
          echo "USE_WEB_AUTH=false" >> .env
          echo "USE_AUTH_CUSTOM_TOKEN=false" >> .env
          echo "POSTHOG_API_KEY=" >> .env

      - name: Bundle ID
        script: |
          set -e
          sed -i '' "s|^APP_BUNDLE_IDENTIFIER=.*|APP_BUNDLE_IDENTIFIER=$BUNDLE_ID|" ios/Flutter/Base.xcconfig

      - name: Paquets Flutter
        script: |
          set -e
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: CocoaPods
        script: cd ios && pod install --repo-update

      - name: Signature iOS
        script: |
          set -e
          # Diagnostic : sans ces trois variables l'API Apple repond 401 et le
          # message ne dit pas laquelle manque.
          for V in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY; do
            eval "VAL=\$$V"
            if [ -z "$VAL" ]; then
              echo "MANQUANTE: $V"
              MANQUE=1
            else
              echo "presente: $V"
            fi
          done
          if [ -n "$MANQUE" ]; then
            echo "Ajouter ces variables au groupe 'pendant' dans Codemagic."
            exit 1
          fi

          # La cle .p8 est un PEM multiligne. Colle telle quelle dans une
          # variable, elle perd parfois ses retours a la ligne, ce qui produit
          # un jeton invalide : Apple repond alors 401 sans plus d'explication.
          # On accepte donc aussi une version encodee en base64.
          # Recreer APP_STORE_CONNECT_PRIVATE_KEY dans le groupe ne changeait
          # jamais les 98 octets recus : la valeur effective ne venait donc PAS
          # du groupe. L'integration app_store_connect peuple aussi les variables
          # APP_STORE_CONNECT_* au moment du build et peut masquer celle du groupe.
          # Parade : lire une variable au nom unique (impossible a masquer) et la
          # passer en flag explicite --private-key, qui prime sur l'environnement.
          KEY_FILE=/tmp/asc_key.p8
          if [ -n "$PENDANT_ASC_KEY_B64" ]; then
            echo "source cle : PENDANT_ASC_KEY_B64"
            printf '%s' "$PENDANT_ASC_KEY_B64" > "$KEY_FILE"
          else
            echo "source cle : APP_STORE_CONNECT_PRIVATE_KEY (repli)"
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
          fi
          # --- Empreinte de la valeur recue (ne divulgue pas le corps de la cle) ---
          # La valeur CORRECTE (fichier AuthKey_F3DXCK9947) doit donner l'une des
          # deux empreintes suivantes ; toute autre signifie que la variable
          # APP_STORE_CONNECT_PRIVATE_KEY ne contient pas la bonne cle :
          #   base64 344 car -> sha256 7d13f00c622af0f29a47373349d36e94d407a4bc43a19996b35b8e03d30bd0ea
          #   PEM   257 oct  -> sha256 d37a752e936b6175d3639358a2253f4dea0987fa277dbfbd36199dc6d5e39aa1
          echo "-- diagnostic cle --"
          echo "longueur        : $(wc -c < "$KEY_FILE") octets"
          echo "nb de lignes    : $(wc -l < "$KEY_FILE")"
          echo "12 premiers car : $(head -c 12 "$KEY_FILE")"
          echo "contient BEGIN  : $(grep -c BEGIN "$KEY_FILE" 2>/dev/null || echo 0)"
          # shasum et non sha256sum : ce dernier n'existe pas sur macOS, et
          # l'empreinte attendue se serait imprimee vide.
          echo "sha256          : $(shasum -a 256 "$KEY_FILE" | cut -d' ' -f1)"
          echo "--------------------"

          # La cle .p8 est prouvee bonne (empreinte de reference verifiee hors
          # ligne) et Apple repond quand meme 401 : restent l'Issuer ID et le
          # Key ID. Etant masques dans les journaux, on compare leur empreinte
          # a celle des valeurs connues valides plutot que leur contenu.
          ISSUER="${PENDANT_ASC_ISSUER_ID:-$APP_STORE_CONNECT_ISSUER_ID}"
          KEYID="${PENDANT_ASC_KEY_ID:-$APP_STORE_CONNECT_KEY_IDENTIFIER}"
          empreinte() { printf '%s' "$1" | shasum -a 256 | cut -d' ' -f1; }
          EI=$(empreinte "$ISSUER")
          EK=$(empreinte "$KEYID")
          echo "-- diagnostic identifiants --"
          echo "issuer  : ${#ISSUER} car, sha256 $EI"
          echo "key id  : ${#KEYID} car, sha256 $EK"
          [ "$EI" = "d132728fa9b548c9deba10a85b44b2ad20ae15be6f9ac9cf1daea6f8c206fe17" ]             && echo "issuer  : CONFORME" || echo "issuer  : NON CONFORME"
          [ "$EK" = "af722230ba237604f68b5c2b3085eca7b13fc5af2f7b3c9d334b232a0758e2c7" ]             && echo "key id  : CONFORME" || echo "key id  : NON CONFORME"
          echo "-----------------------------"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "cle non reconnue comme PEM, tentative de decodage base64"
            # Entree standard et non argument positionnel : le base64 de macOS
            # n'accepte pas de nom de fichier en argument.
            if base64 --decode < "$KEY_FILE" > "$KEY_FILE.dec" 2>/dev/null && grep -q "BEGIN PRIVATE KEY" "$KEY_FILE.dec"; then
              mv "$KEY_FILE.dec" "$KEY_FILE"
              echo "decodage base64 reussi"
            else
              echo "ERREUR: la cle .p8 (PENDANT_ASC_KEY_B64) n'est ni un PEM ni du base64 valide."
              exit 1
            fi
          fi
          echo "cle .p8 : $(wc -l < "$KEY_FILE") lignes, marqueurs PEM: $(grep -c 'PRIVATE KEY' "$KEY_FILE")"
          if [ "$(wc -l < "$KEY_FILE")" -lt 3 ]; then
            echo "ERREUR: la cle tient sur moins de 3 lignes, ses retours a la ligne ont ete perdus."
            echo "Recolle-la dans Codemagic en conservant les sauts de ligne, ou encode-la en base64."
            exit 1
          fi

          keychain initialize
          # Le build embarque trois applications : l'app, l'extension widget
          # (BatteryWidget) et l'app Watch (omiWatchApp), toutes deux integrees
          # au Runner. On recupere donc les trois profils explicitement ;
          # --create les cree au besoin, ainsi que le certificat de
          # distribution s'il n'existe pas encore sur le compte. Ce dernier
          # exige une cle privee RSA : elle doit rester identique d'un build a
          # l'autre, sinon chaque build cree un certificat de plus et Apple en
          # limite le nombre a trois par compte.
          for ID in "$BUNDLE_ID" "$BUNDLE_ID.widget" "$BUNDLE_ID.watchapp"; do
            echo "== profil pour $ID"
            app-store-connect fetch-signing-files "$ID" --type IOS_APP_STORE --issuer-id "$ISSUER" --key-id "$KEYID" --private-key @file:$KEY_FILE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          done
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          # OMI_SELF_HOSTED désactive validateStartupRouting, qui sinon lève un
          # StateError car l'URL ne correspond pas à celle du profil `production`.
          flutter build ipa \
            --release \
            --flavor prod \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=OMI_SELF_HOSTED=true \
            --dart-define=OMI_API_BASE_URL=$OMI_API_BASE_URL \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
